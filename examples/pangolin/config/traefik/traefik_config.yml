# Pangolin's Traefik static configuration, trimmed for a local HTTP-only run.
# The only Sablier-specific addition is the `sablier` entry under
# `experimental.plugins` below.

api:
  insecure: true
  dashboard: true

providers:
  # Generated by Pangolin from its database. This is where your resource
  # routers come from, and it is NOT editable by hand.
  http:
    endpoint: "http://pangolin:3001/api/v1/traefik-config"
    pollInterval: "5s"
  # Hand-written. This is where the Sablier middleware is declared.
  file:
    filename: "/etc/traefik/dynamic_config.yml"

experimental:
  plugins:
    badger:
      moduleName: "github.com/fosrl/badger"
      # Pinned: v1.6.x/v1.7.0 currently fail Traefik's plugin integrity check.
      # Use whatever version your own Pangolin install shipped with.
      version: "v1.5.0"
    sablier:
      moduleName: "github.com/sablierapp/sablier-traefik-plugin"
      version: "v1.3.0" # x-release-please-version
  # To test your local working copy instead, comment out the `sablier` entry
  # above, uncomment the block below, and uncomment the plugins-local volume
  # in compose.yml.
  # localPlugins:
  #   sablier:
  #     moduleName: "github.com/sablierapp/sablier-traefik-plugin"

log:
  level: "INFO"

entryPoints:
  web:
    address: ":80"

serversTransport:
  insecureSkipVerify: true
